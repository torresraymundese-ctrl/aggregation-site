name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Cross
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build release
        run: |
          cargo build --release --locked

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/overseas-api:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/overseas-api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app/overseas-api
            docker pull ${{ secrets.DOCKER_USERNAME }}/overseas-api:${{ github.sha }}
            docker tag ${{ secrets.DOCKER_USERNAME }}/overseas-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/overseas-api:latest
            docker-compose up -d --force-recreate
            docker rmi $(docker images -q -f before=${{ github.sha }} -f dangling=true) 2>/dev/null || true
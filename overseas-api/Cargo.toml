[package]
name = "overseas-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }
bytes = "1"
futures-util = "0.3"
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Authentication
bcrypt = "0.15"
jsonwebtoken = "9"
aes-gcm = "0.10"
base64 = "0.22"

# Error handling
thiserror = "1"
anyhow = "1"

# Configuration
config = "0.14"
once_cell = "1"
dotenvy = "0.15"

# Utilities
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
ipnet = "2"

[dev-dependencies]
# Testing
tower = { version = "0.4", features = ["util"] }
http-body = "0.4"

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT:-8080}
      - RUST_ENV=production
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET}
      - PROVIDER_OPENAI_API_KEY=${PROVIDER_OPENAI_API_KEY}
      - PROVIDER_ANTHROPIC_API_KEY=${PROVIDER_ANTHROPIC_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - api-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - api-network

networks:
  api-network:
    driver: bridge